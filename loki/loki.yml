# Loki as a single process on the local disk (the volume loki-data)
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-09-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 90d
  # the first start takes the logs the containers still have: up to a week back
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  # detected_level for the lines Alloy gave no level (see alloy/config.alloy)
  discover_log_levels: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# no usage statistics to grafana.com
analytics:
  reporting_enabled: false
