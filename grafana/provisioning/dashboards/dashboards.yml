apiVersion: 1

# the dashboards of grafana/dashboards; a change made in the UI has to be exported to the JSON file to stay
providers:
  - name: gaile.ee
    folder: gaile.ee
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
