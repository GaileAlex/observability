apiVersion: 1

# A rule taken out of this file stays in Grafana until it is deleted here. gpu-memory (VRAM above 95%) was noise: the
# local chat model and Whisper loaded together always take 96-98%, and Ollama sees ~14.8 GiB free whatever the other
# containers hold, so it loads every layer on the GPU and never moved any to the CPU as the alert said
deleteRules:
  - orgId: 1
    uid: gpu-memory

# Few alerts, each worth an e-mail. Every rule: A - the query, B - its last value (the same in every rule:
# &last-value), C - the condition on B
groups:
  - orgId: 1
    name: gaile.ee
    folder: gaile.ee
    interval: 1m
    rules:
      - uid: service-down
        title: Сервис не отвечает
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.instance }} ({{ $labels.job }}) не отвечает: контейнер остановлен или упал'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # the metrics of a probe job come from the blackbox exporter: probe_success tells about the service.
              # probe-internet is no service: a lost uplink already fails probe-site
              expr: up{job!~"probe-.*"} or probe_success{job!="probe-internet"}
              instant: true
          - &last-value
            refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [ 1 ] } } ] }

      - uid: http-5xx
        title: Ответы 5xx
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.application }}: {{ with $values.B }}{{ humanize .Value }}{{ end }} ответов 5xx за 10 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (application) (increase(http_server_requests_seconds_count{status=~"5.."}[10m]))
              instant: true
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 5 ] } } ] }

      - uid: error-logs
        title: Много ошибок в логах
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.container }}: {{ with $values.B }}{{ humanize .Value }}{{ end }} строк с уровнем error за 10 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum by (container) (count_over_time({level="error", container!~"obs-.*"}[10m]))
              queryType: instant
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 20 ] } } ] }

      - uid: container-restarts
        title: Контейнер перезапускается
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.name }} перезапустился {{ with $values.B }}{{ humanize .Value }}{{ end }} раз за 15 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (name) (changes(container_start_time_seconds[15m]))
              instant: true
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 2 ] } } ] }

      # whether the site answers is checked by service-down (the job probe-site); this rule watches its certificate
      - uid: site-certificate
        title: Сертификат сайта скоро истечёт
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Сертификат {{ $labels.instance }} истекает через {{ with $values.B }}{{ humanize .Value }}{{ end }} дн.: обновите /etc/nginx/certs в cv-ui'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (probe_ssl_earliest_cert_expiry{job="probe-site"} - time()) / 86400
              instant: true
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [ 14 ] } } ] }

      # LoginAttemptService of CV blocks 20 failures of an address in 15 minutes: more of them come from many addresses
      - uid: password-guessing
        title: Подбор паролей
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ with $values.B }}{{ humanize .Value }}{{ end }} неверных паролей за 15 минут: {container="cv-app"} |= "Wrong password"'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({container="cv-app"} |= "Wrong password for" [15m]))
              queryType: instant
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 20 ] } } ] }

      # requests refused by the limits of CV: 429 in the access log of cv-ui (the chat limits per minute of nginx,
      # the daily limit of the models and the sign-in limits of cv-app). A person does not reach them: a script does.
      # Counted per client address (the first field of the access line of cv-ui), so the e-mail names it.
      # The connections over the limit of an address in nginx for Windows ("limiting connections") are not counted:
      # mass scanners looking for /.env, /.aws/credentials or the /cgi-bin of routers open dozens of connections at
      # once, the limit cuts them and they get only 301/404, there is nothing to do. Counted, they fired this alert
      # 4 times on 2026-11-12/13 (22 to 235 refusals) while cv-ui had no 429 at all in those 3 days. Their lines
      # stay in the logs (container windows-nginx)
      - uid: request-limits
        title: Срабатывают лимиты запросов
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Адрес {{ $labels.address }}: {{ with $values.B }}{{ humanize .Value }}{{ end }} ответов 429 за 15 минут. Его запросы с путями: {container="cv-ui"} |= "{{ $labels.address }}"; отказы: {container="cv-ui"} |= "\" 429 " |= "{{ $labels.address }}"'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (address) (count_over_time({container="cv-ui"} |= "\" 429 " | regexp `^(?P<address>[0-9a-fA-F.:]+) - ` [15m]))'
              queryType: instant
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 20 ] } } ] }

      # errors of the scripts in the browsers of the visitors (ClientErrorHandler of the frontend -> ClientErrorLog)
      - uid: browser-errors
        title: Ошибки в браузерах посетителей
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ with $values.B }}{{ humanize .Value }}{{ end }} ошибок скриптов сайта за 15 минут, после деплоя страница могла сломаться: {container="cv-app"} |= "Browser error"'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({container="cv-app"} |= "Browser error on" [15m]))
              queryType: instant
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 10 ] } } ] }

      # pg-backup of CV runs at 2:00 and 20:00 and writes this line after each backup; a failed backup writes
      # nothing like it, so its absence is the alert
      - uid: backup-missing
        title: Нет свежего бэкапа базы
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'pg-backup не сделал ни одного бэкапа за сутки: {container="pg-backup"}'
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: absent_over_time({container="pg-backup"} |= "SQL backup created successfully" [24h])
              queryType: instant
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: gt, params: [ 0 ] } } ] }

      # estonian-tts falls back to the CPU by itself when CUDA does not start (an update of Docker Desktop or of the
      # driver, 2026-11-06): the voice still works, 7-8 times slower (an answer 0.25 s -> 1.9 s). A stopped service is
      # the alert service-down, here no data is OK
      - uid: estonian-tts-on-cpu
        title: Эстонский голос на CPU
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'estonian-tts синтезирует на CPU: CUDA не запустилась, голос в 7-8 раз медленнее. docker compose up -d --force-recreate supertonic в estonian-tts; после обновления Docker сначала wsl --shutdown'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: estonian_tts_on_gpu
              instant: true
          - *last-value
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: threshold, expression: B, conditions: [ { evaluator: { type: lt, params: [ 1 ] } } ] }
