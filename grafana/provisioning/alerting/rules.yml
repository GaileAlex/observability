apiVersion: 1

# Few alerts, each worth an e-mail. Every rule: A - the query, B - its last value, C - the condition on B
groups:
  - orgId: 1
    name: gaile.ee
    folder: gaile.ee
    interval: 1m
    rules:
      - uid: service-down
        title: Сервис не отвечает
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.instance }} ({{ $labels.job }}) не отвечает: контейнер остановлен или упал'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              # the metrics of a probe job come from the blackbox exporter: probe_success tells about the service.
              # probe-internet is no service: a lost uplink already fails probe-site
              expr: up{job!~"probe-.*"} or probe_success{job!="probe-internet"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [ 1 ] }

      - uid: http-5xx
        title: Ответы 5xx
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.application }}: {{ with $values.B }}{{ humanize .Value }}{{ end }} ответов 5xx за 10 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (application) (increase(http_server_requests_seconds_count{status=~"5.."}[10m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 5 ] }

      - uid: error-logs
        title: Много ошибок в логах
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.container }}: {{ with $values.B }}{{ humanize .Value }}{{ end }} строк с уровнем error за 10 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum by (container) (count_over_time({level="error", container!~"obs-.*"}[10m]))
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 20 ] }

      - uid: gpu-memory
        title: Память GPU почти кончилась
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Занято {{ with $values.B }}{{ humanizePercentage .Value }}{{ end }} памяти GPU: Ollama начнёт выгружать слои модели на CPU'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(nvidia_smi_memory_used_bytes) / sum(nvidia_smi_memory_total_bytes)
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 0.95 ] }

      - uid: container-restarts
        title: Контейнер перезапускается
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ $labels.name }} перезапустился {{ with $values.B }}{{ humanize .Value }}{{ end }} раз за 15 минут'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: max by (name) (changes(container_start_time_seconds[15m]))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 2 ] }

      # the site as a visitor reaches it is in service-down (the job probe-site); here its certificate
      - uid: site-certificate
        title: Сертификат сайта скоро истечёт
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'Сертификат {{ $labels.instance }} истекает через {{ with $values.B }}{{ humanize .Value }}{{ end }} дн.: обновите /etc/nginx/certs в cv-ui'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              expr: (probe_ssl_earliest_cert_expiry{job="probe-site"} - time()) / 86400
              instant: true
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [ 14 ] }

      # LoginAttemptService of CV blocks 20 failures of an address in 15 minutes: more of them come from many addresses
      - uid: password-guessing
        title: Подбор паролей
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ with $values.B }}{{ humanize .Value }}{{ end }} неверных паролей за 15 минут: {container="cv-app"} |= "Wrong password"'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({container="cv-app"} |= "Wrong password for" [15m]))
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 20 ] }

      # errors of the scripts in the browsers of the visitors (ClientErrorHandler of the frontend -> ClientErrorLog)
      - uid: browser-errors
        title: Ошибки в браузерах посетителей
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: '{{ with $values.B }}{{ humanize .Value }}{{ end }} ошибок скриптов сайта за 15 минут, после деплоя страница могла сломаться: {container="cv-app"} |= "Browser error"'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: sum(count_over_time({container="cv-app"} |= "Browser error on" [15m]))
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 10 ] }

      # pg-backup of CV runs at 2:00 and 20:00 and writes this line after each backup; a failed backup writes
      # nothing like it, so its absence is the alert
      - uid: backup-missing
        title: Нет свежего бэкапа базы
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: 'pg-backup не сделал ни одного бэкапа за сутки: {container="pg-backup"}'
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              expr: absent_over_time({container="pg-backup"} |= "SQL backup created successfully" [24h])
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [ 0 ] }
