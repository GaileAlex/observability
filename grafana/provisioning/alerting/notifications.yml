apiVersion: 1

# SMTP: GF_SMTP_* of docker-compose.yml, the address: ALERT_EMAIL of .env
contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: [ grafana_folder, alertname ]
    group_wait: 1m
    group_interval: 10m
    repeat_interval: 12h
